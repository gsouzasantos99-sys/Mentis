<!DOCTYPE html>
<html>

<head>

<style>

body{
    margin:0;
}

.container{
    position:relative;
    width:1024px;
    height:1536px;
}

.background{
    width:100%;
    position:absolute;
    left:0;
    top:0;
}

.qr{
    position:absolute;

    left:565px;
    top:790px;

    width:220px;
    height:220px;
}

</style>

</head>

<body>

<div class="container">

    <img
        class="background"
        src="https://raw.githubusercontent.com/gsouzasantos99-sys/Mentis/refs/heads/main/Folheto%20Mentis%20PT.png">

    <img
        id="qr"
        class="qr">

</div>

<script>

const params = new URLSearchParams(window.location.search);

const qr = params.get("qr");

document.getElementById("qr").src = qr;

</script>

</body>

</html>
