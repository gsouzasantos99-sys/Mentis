<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    overflow:auto;
}

.container{
    position:relative;
    width:1024px;
    height:1536px;
}

.background{
    position:absolute;
    left:0;
    top:0;

    width:1024px;
    height:1536px;
}

/* QR AJUSTADO */
.qr{
    position:absolute;

    left:710px;
    top:1000px;

    width:300px;
    height:300px;

    object-fit:contain;
}

</style>

</head>

<body>

<div class="container">

    <!-- fundo -->
    <img
        class="background"
        src="https://raw.githubusercontent.com/gsouzasantos99-sys/Mentis/main/Folheto%20Mentis%20PT.png">

    <!-- qr dinâmico -->
    <img
        id="qr"
        class="qr">

</div>

<script>

const params = new URLSearchParams(window.location.search);

const qr = params.get("qr");

if(qr){
    document.getElementById("qr").src = qr;
}

</script>

</body>

</html>
